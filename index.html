<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17506F">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Fichas, quiz y simulador de comanda para aprender las pizzas de La Rosetta y sus ingredientes.">
  <title>Pizzas La Rosetta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317506F'/%3E%3Cpath d='M16 6l9 19H7z' fill='%23F6C945'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Cormorant+Garamond:wght@600&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="band">
    <div class="wrap">
      <div class="brand" aria-label="La Rosetta"><span>La</span><span>Rosetta</span></div>
      <div class="prog"><span class="prog-l" id="progLabel">Dominadas</span><b id="progTxt">0 / 37</b><div class="bar"><i id="progBar"></i></div></div>
    </div>
  </header>

  <main class="wrap" id="app"></main>

  <nav class="tabs" id="tabs" aria-label="Secciones">
    <div class="tabs-in">
      <button class="tab" data-tab="lista"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17M11 6h9.5M11 12h9.5M11 18h9.5"/></svg>Mi lista</button>
      <button class="tab" data-tab="fichas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 3.5h10"/></svg>Fichas</button>
      <button class="tab" data-tab="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>Quiz</button>
      <button class="tab" data-tab="comanda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Comanda</button>
      <button class="tab" data-tab="carta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Carta</button>
    </div>
  </nav>

  <script src="data.js"></script>
  <script src="photos.js"></script>
  <script src="app.js"></script>
</body>
</html>
